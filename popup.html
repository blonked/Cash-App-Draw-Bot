<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Syne', Arial, sans-serif;
  width: 300px;
  background: #0a0a0b;
  color: #fff;
  overflow: hidden;
  position: relative;
}

/* ── GRID BACKGROUND ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 0;
}

/* ── GREEN GLOW ── */
body::after {
  content: '';
  position: fixed;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, rgba(0,229,160,0.12) 0%, transparent 70%);
  bottom: -60px;
  right: -40px;
  pointer-events: none;
  z-index: 0;
}

/* ── LOGO ── */
.logo {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 14px 18px 0;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 7px;
}
.logo span.green { color: #00e5a0; }
.logo-badge {
  font-size: 8px;
  font-family: 'Space Mono', monospace;
  background: #00e5a0;
  color: #000;
  padding: 2px 5px;
  border-radius: 3px;
  letter-spacing: 1px;
}

/* ── APP SCREEN ── */
#app-screen {
  position: relative;
  z-index: 1;
  padding: 16px 18px 20px;
}

.screen-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  color: #00e5a0;
  letter-spacing: 2px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.screen-label::before {
  content: '';
  width: 5px; height: 5px;
  background: #00e5a0;
  border-radius: 50%;
  display: inline-block;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.app-header h3 {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.app-header h3 span { color: #00e5a0; }

.upload-area {
  border: 1px dashed #222;
  border-radius: 8px;
  padding: 14px;
  text-align: center;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
}
.upload-area:hover { border-color: #00e5a0; background: rgba(0,229,160,0.03); }
.upload-area input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.upload-icon { font-size: 20px; margin-bottom: 4px; }
.upload-text { font-size: 10px; color: #555; font-family: 'Space Mono', monospace; }
.upload-text span { color: #00e5a0; }
#file-name {
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  color: #00e5a0;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#draw {
  width: 100%;
  padding: 11px;
  background: #00e5a0;
  border: none;
  border-radius: 8px;
  color: #000;
  font-weight: 800;
  font-size: 13px;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  letter-spacing: 0.3px;
}
#draw:hover { background: #00c988; }
#draw:active { transform: scale(0.98); }
#draw:disabled { background: #1a3329; color: #00e5a040; cursor: not-allowed; transform: none; }

/* ── PREVIEW PANEL ── */
#preview-panel {
  display: none;
  margin-top: 12px;
  animation: fadeSlideIn 0.25s ease;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.preview-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  color: #00e5a0;
  letter-spacing: 2px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.preview-label::before {
  content: '';
  width: 5px; height: 5px;
  background: #00e5a0;
  border-radius: 50%;
  display: inline-block;
}
.stroke-count {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: #555;
}
.stroke-count span { color: #00e5a0; }

#preview-canvas {
  width: 100%;
  border-radius: 6px;
  border: 1px solid #1a1a1a;
  background: #111;
  display: block;
  margin-bottom: 10px;
  image-rendering: pixelated;
}

#confirm-draw {
  width: 100%;
  padding: 11px;
  background: transparent;
  border: 1.5px solid #00e5a0;
  border-radius: 8px;
  color: #00e5a0;
  font-weight: 800;
  font-size: 13px;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, transform 0.1s;
  letter-spacing: 0.3px;
}
#confirm-draw:hover { background: #00e5a0; color: #000; }
#confirm-draw:active { transform: scale(0.98); }
#confirm-draw:disabled { border-color: #1a3329; color: #00e5a040; cursor: not-allowed; transform: none; }

/* ── PROGRESS PANEL ── */
#progress-panel {
  display: none;
  margin-top: 12px;
  animation: fadeSlideIn 0.25s ease;
}

.progress-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  color: #00e5a0;
  letter-spacing: 2px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.progress-label::before {
  content: '';
  width: 5px; height: 5px;
  background: #00e5a0;
  border-radius: 50%;
  animation: pulse 1s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.progress-track {
  width: 100%;
  height: 6px;
  background: #161616;
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid #1e1e1e;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00e5a0, #00c988);
  border-radius: 99px;
  transition: width 0.15s ease;
  box-shadow: 0 0 8px rgba(0,229,160,0.4);
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}
.progress-stat {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: #333;
}
.progress-stat span { color: #00e5a0; }

canvas { display: none; }
</style>
</head>
<body>

<!-- Logo -->
<div class="logo">
  CardDraw<span class="green">Pro</span>
  <span class="logo-badge">CHROME</span>
</div>

<!-- Main App -->
<div id="app-screen">
  <div class="app-header">
    <h3>Upload an <span>image</span></h3>
  </div>
  <div class="screen-label">DRAW IMAGE</div>
  <div class="upload-area" id="upload-area">
    <input type="file" id="img" accept="image/*">
    <div class="upload-icon">↑</div>
    <div class="upload-text">Drop image or <span>browse</span></div>
    <div id="file-name"></div>
  </div>
  <button id="draw">Convert & Preview →</button>

  <!-- Preview Panel -->
  <div id="preview-panel">
    <div class="preview-label">
      <span style="display:flex;align-items:center;gap:6px;">
        <span></span>PREVIEW
      </span>
      <span class="stroke-count">
        <span id="stroke-count-num">0</span> strokes
      </span>
    </div>
    <canvas id="preview-canvas"></canvas>
    <button id="confirm-draw">Confirm & Draw →</button>
  </div>

  <!-- Progress Panel -->
  <div id="progress-panel">
    <div class="progress-label">
      <span>DRAWING</span>
      <span id="progress-pct" style="font-family:'Space Mono',monospace;font-size:9px;color:#00e5a0;">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-stats">
      <div class="progress-stat">DONE <span id="prog-done">0</span></div>
      <div class="progress-stat">TOTAL <span id="prog-total">0</span></div>
      <div class="progress-stat">LEFT <span id="prog-left">0</span></div>
    </div>
  </div>

  <canvas id="hidden"></canvas>
</div>

<script src="imagetracer.js"></script>
<script src="popup.js"></script>

<script>
document.getElementById('img').addEventListener('change', function() {
  const name = this.files[0]?.name || '';
  document.getElementById('file-name').textContent = name;
  // Reset preview if user picks a new file
  document.getElementById('preview-panel').style.display = 'none';
  document.getElementById('progress-panel').style.display = 'none';
  document.getElementById('draw').textContent = 'Convert & Preview →';
  document.getElementById('draw').disabled = false;
});
</script>
</body>
</html>
